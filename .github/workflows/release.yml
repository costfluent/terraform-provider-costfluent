name: release

# Runs on a vX.Y.Z tag. The Terraform Registry reads releases from this repository, so the signed
# artifacts are built here, each zip with an SPDX SBOM, and attested so a user can verify a zip, its
# SBOM or the checksum file with `gh attestation verify`.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tests run code from every module the provider depends on, so they run in a job of their own
  # whose token can write nothing and request no OIDC token, which would let that code attest a build
  # of its own as this workflow's.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false

      # The provider's tests run Terraform. With none on PATH the test framework downloads it once per
      # test, and releases have failed there on an expired HashiCorp signing key and on parallel tests
      # executing a binary still being written. It is installed by checksum rather than by an action:
      # this repository allows only the actions its release needs, and GitHub fails the whole run at
      # startup on any other, so the tag stays public with no release.
      - name: Setup terraform
        env:
          TERRAFORM_VERSION: 1.16.5
          # The linux_amd64 archive's SHA-256 in HashiCorp's signed SHA256SUMS for this version.
          TERRAFORM_SHA256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform-archive"
          curl -fsSL --retry 3 -o "$archive" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $archive" | sha256sum --check --strict
          unzip -q "$archive" terraform -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/terraform/terraform" version

      # The tag is cut from a reviewed merge, so this is the last chance to stop a broken build
      # before it is signed and ingested by the registry.
      - name: Test
        run: go test ./...

  release:
    name: goreleaser
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # goreleaser derives the version from tags, so a shallow clone breaks it.
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false

      # The registry verifies the SHA256SUMS signature against this key, so a release is only
      # ingestible if it is signed by the key registered with the provider.
      - name: Import gpg key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The tag's message is the reviewed release notes. The tag is fetched again because checkout
      # can leave an annotated tag lightweight, which has no message.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"

      # GoReleaser writes the SBOMs with syft. It is a release binary pinned by version and checksum
      # rather than another action, since this repository allows only the actions its release needs.
      - name: Install syft
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # By path rather than through the checksum file, which leaves the SBOMs out so the file the
      # registry reads keeps its shape; the manifest is covered through its line in that file.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.zip.sbom.json
            dist/*_SHA256SUMS
