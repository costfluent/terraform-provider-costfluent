name: release

# Runs on a vX.Y.Z tag. The Terraform Registry reads releases from this repository, so the signed
# artifacts are built here.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # goreleaser derives the version from tags, so a shallow clone breaks it.
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false

      # The provider's tests run Terraform. With none on PATH the test framework downloads it once per
      # test, and releases have failed there on an expired HashiCorp signing key and on parallel tests
      # executing a binary still being written. It is installed by checksum rather than by an action:
      # this repository allows only the actions its release needs, and GitHub fails the whole run at
      # startup on any other, so the tag stays public with no release.
      - name: Setup terraform
        env:
          TERRAFORM_VERSION: 1.16.5
          # The linux_amd64 archive's SHA-256 in HashiCorp's signed SHA256SUMS for this version.
          TERRAFORM_SHA256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform-archive"
          curl -fsSL --retry 3 -o "$archive" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $archive" | sha256sum --check --strict
          unzip -q "$archive" terraform -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/terraform/terraform" version

      # The tag is cut from a reviewed merge, so this is the last chance to stop a broken build
      # before it is signed and ingested by the registry.
      - name: Test
        run: go test ./...

      # The registry verifies the SHA256SUMS signature against this key, so a release is only
      # ingestible if it is signed by the key registered with the provider.
      - name: Import gpg key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The tag's message is the reviewed release notes. The tag is fetched again because checkout
      # can leave an annotated tag lightweight, which has no message.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
