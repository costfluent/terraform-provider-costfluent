name: release

# This file is mirrored from the Costfluent monorepo at toolkit/terraform-provider/ and runs in the
# public repository, which is where it has to run: the Terraform Registry reads releases from the
# public repository, and the monorepo is private. The tag that triggers it is pushed by
# `scripts/publish-public.sh release terraform-provider vX.Y.Z` after the sync pull request merges.
#
# Do not edit this file here. Edit it in the monorepo and publish; a change made in the public
# repository is destroyed by the next sync.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # goreleaser derives the version and changelog from tags, so a shallow clone breaks it.
          fetch-depth: 0

      # The registry verifies the SHA256SUMS signature against this key, so a release is only
      # ingestible if it is signed by the key registered with the provider.
      - name: Import gpg key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
