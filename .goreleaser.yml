version: 2

# Set explicitly, never inferred. GoReleaser derives project_name from the repository it releases
# into, and the Terraform Registry requires artifacts named for the provider — a release cut from
# anywhere else would produce names the registry silently refuses.
project_name: terraform-provider-costfluent

# The release body is the version alone; a changelog would list commit subjects verbatim.
changelog:
  disable: true

builds:
  # The main package is under cmd/, not at the repository root, and GoReleaser defaults to the root
  # — without this the build fails with "does not contain a main function".
  - main: ./cmd/terraform-provider-costfluent
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  # The Terraform Registry requires every release artifact, including the protocol manifest, in
  # the signed checksum file. release.extra_files uploads it but does not checksum it implicitly.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # The registry ingests the manifest as a release artifact, named for the version like every
  # other file in the release.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

  # The registry only reads finalized releases; a draft is invisible to it.
  draft: false
